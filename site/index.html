<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Where Are They</title>
  <meta name="description" content="A navigable knowledge map of UAP / NHI testimony, programs, hearings and incidents.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='5' fill='%237cc4ff'/><circle cx='16' cy='16' r='13' fill='none' stroke='%237cc4ff' stroke-width='2' stroke-dasharray='4 4'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@1,400;1,500&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header class="top">
    <button class="icon-btn only-mobile" id="btn-side" aria-label="Filters">☰</button>
    <a class="brand" href="#/home" data-view="home" title="Home">
      <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><circle cx="16" cy="16" r="4.5" fill="currentColor"/><circle cx="16" cy="16" r="12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3.5 3.5"/></svg>
      <span class="brand-text"><b>WHERE ARE THEY</b><small>UAP · NHI CASE ARCHIVE</small></span>
    </a>
    <div class="search">
      <input id="q" type="search" placeholder="Search people, programs, incidents…  ( / )" autocomplete="off" spellcheck="false">
      <div id="q-results" class="dropdown" hidden></div>
    </div>
    <nav class="views" id="views">
      <a data-view="graph" href="#/graph">Graph</a>
      <a data-view="timeline" href="#/timeline">Timeline</a>
      <a data-view="map" href="#/map">World</a>
      <a data-view="videos" href="#/videos">Videos</a>
      <a data-view="index" href="#/index">Index</a>
      <a data-view="claims" href="#/claims">Claims</a>
    </nav>
    <button class="icon-btn" id="btn-theme" aria-label="Toggle theme" title="Theme">◐</button>
  </header>

  <div class="app is-home" id="app">
    <aside class="side" id="side">
      <div id="filters">
        <section class="f-block">
          <label class="switch">
            <input type="checkbox" id="f-credible" checked>
            <span class="track"></span>
            <span><b>Official sources only</b><small>Officials, military, pilots, intelligence, academia, Congress</small></span>
          </label>
        </section>
        <section class="f-block">
          <h4>Types</h4>
          <div id="f-types" class="f-types"></div>
        </section>
        <section class="f-block">
          <h4>Years <span id="f-yr-label" class="muted"></span></h4>
          <svg id="f-hist" class="hist" viewBox="0 0 240 44" preserveAspectRatio="none"></svg>
          <div class="range2">
            <input type="range" id="f-yr-a" aria-label="From year">
            <input type="range" id="f-yr-b" aria-label="To year">
          </div>
        </section>
        <section class="f-block">
          <h4>Themes <button class="link" id="f-tags-clear" hidden>clear</button></h4>
          <div id="f-tags" class="chips"></div>
        </section>
        <section class="f-block only-graph">
          <h4>Graph</h4>
          <label class="check"><input type="checkbox" id="f-mentions"> Show transcript mentions</label>
          <button class="btn small" id="btn-relayout">Re-arrange</button>
        </section>
        <footer class="f-stats" id="f-stats"></footer>
      </div>
      <div id="vid-side" hidden>
        <div class="vs-search">
          <input id="tq" type="search" placeholder="Search inside all transcripts…" autocomplete="off" spellcheck="false">
          <div class="muted small" id="tq-info"></div>
        </div>
        <div id="vid-list" class="vid-list"></div>
      </div>
    </aside>

    <main class="main" id="main">
      <section class="view home" id="view-home"></section>
      <section class="view" id="view-graph" hidden><div id="cy"></div><div class="legend" id="legend"></div></section>
      <section class="view" id="view-timeline" hidden><div class="timeline" id="timeline"></div></section>
      <section class="view" id="view-map" hidden><div id="map"></div></section>
      <section class="view" id="view-videos" hidden>
        <div class="player-col">
          <div class="player-wrap" id="player-wrap"><div id="yt"></div><video id="local-video" controls playsinline hidden></video><div class="player-empty" id="player-empty">Pick a video, or search the transcripts.</div></div>
          <div id="vid-detail"></div>
        </div>
      </section>
      <section class="view" id="view-claims" hidden>
        <div class="index-bar">
          <input id="cq" type="search" placeholder="Filter claims…" autocomplete="off">
          <div class="seg" id="c-status"></div>
          <span class="muted" id="cq-count"></span>
        </div>
        <div id="claims" class="claims"></div>
      </section>
      <section class="view" id="view-index" hidden>
        <div class="index-bar"><input id="iq" type="search" placeholder="Filter the index…" autocomplete="off"><span class="muted" id="iq-count"></span></div>
        <div id="index" class="index"></div>
      </section>
    </main>

    <aside class="panel" id="panel" hidden>
      <button class="icon-btn panel-close" id="panel-close" aria-label="Close">✕</button>
      <div id="panel-body"></div>
    </aside>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/layout-base@2.0.1/layout-base.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cose-base@2.2.0/cose-base.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="data/kb.js"></script>
  <script src="data/mentions.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
