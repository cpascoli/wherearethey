# Netlify: build the static site from content/ + media/ and publish site/.
[build]
  command = "npm run build"
  publish = "site"

[build.environment]
  NODE_VERSION = "22"
  # Puppeteer is only used by local import tools; never download a browser on Netlify.
  PUPPETEER_SKIP_DOWNLOAD = "true"
  # Public Cloudflare R2 bucket holding library PDFs/images (see README → Heavy files).
  # Switch to a custom domain later by changing this one value.
  FILES_BASE = "https://pub-86f038fb92684457b9683cd2fd44620e.r2.dev"

# Security headers on every response.
# CSP: scripts only from our own origin and the few hosts the app loads code from (the graph and map libraries on
# cdnjs/jsdelivr, pinned with integrity hashes in templates/app.html; Google Analytics; YouTube's player API; X's embed
# script). Inline scripts stay allowed (the boot loader, the geo edge function's country line, JSON-LD), and
# 'wasm-unsafe-eval' is for Pagefind's search (/mod-files). Pictures, video, embeds and fetches may come from any
# https host (R2, DVIDS, archive.org, YouTube, Wayback…), so those lists don't break when a new source is filed.
# frame-ancestors / X-Frame-Options: other sites can't show our pages inside a frame (clickjacking).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://www.googletagmanager.com https://www.youtube.com https://platform.twitter.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; frame-src https:; connect-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# /account (docs/accounts.md, 4.2) runs under a policy of its own, on top of the one above (a browser enforces both):
# only our own files, no inline script or style, nothing from another site, no framing. Keep ACCOUNT_CSP in
# tests/helpers.mjs the same: the UI tests load the page under it.
[[headers]]
  for = "/account"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"
# the API's answers are never cached, by anything
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# The app's code and data are requested with a content hash (?v=…, scripts/pages.mjs), so a deploy changes their
# URLs: data can be kept for a year. Pages themselves are never cached (the geo edge function marks them no-store).
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
# app.js and app.css are versioned too, but images and covers keep their names when replaced, so an hour for all
# (a rule per file would combine with this one, as Netlify merges matching rules)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
# open tabs ask for this to learn of a new deploy
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"

# The MoD UFO files search index (scripts/mod-index.mjs, ~37,000 small files) lives on R2, uploaded with
# `npm run r2:index`, so the Netlify build stays fast. The /mod-files page and the app fetch it from the bucket's own
# address (FILES_BASE; the bucket allows our origin by CORS) with the loader in /assets/mod-search. It is NOT proxied
# through our origin: a proxy would serve whatever is in the bucket, HTML and scripts included, as wherearethey.info.

# removed duplicates: old links point to the version we kept
[[redirects]]
  from = "/video/two-airmen-finally-tell-the-story-of-their-terrifying-ufo"
  to = "/video/air-force-veterans-abducted-by-aliens-reunite-50-years-later"
  status = 301
[[redirects]]
  from = "/video/2007-11-12-general-parviz-jafari-ufo-testimony"
  to = "/video/national-press-club-november-12th-2007-ufo-close-encounters?t=1456"
  status = 301
[[redirects]]
  from = "/video/dr-eric-davis-space-time-species-types-uap-hearing-may-1-2025"
  to = "/video/understanding-uap-science-national-security-innovation-house?t=4846"
  status = 301
