# Netlify: build the static site from content/ + media/ and publish site/.
[build]
  command = "npm run build"
  publish = "site"

[build.environment]
  NODE_VERSION = "22"
  # Puppeteer is only used by local import tools; never download a browser on Netlify.
  PUPPETEER_SKIP_DOWNLOAD = "true"
  # Public Cloudflare R2 bucket holding library PDFs/images (see README → Heavy files).
  # Switch to a custom domain later by changing this one value.
  FILES_BASE = "https://pub-86f038fb92684457b9683cd2fd44620e.r2.dev"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Documentaries and books used to share one page
[[redirects]]
  from = "/documentaries-and-books"
  to = "/documentaries"
  status = 301

# Nov 2024 hearing: duplicate/looped recordings replaced by the official upload
[[redirects]]
  from = "/video/ufo-uap-congressional-hearing-nov-13-2024-full-uncut-session"
  to = "/video/unidentified-anomalous-phenomena-exposing-the-truth-2024"
  status = 301
[[redirects]]
  from = "/video/hearing-on-unidentified-anomalous-ufo-phenomena-11-12-2024"
  to = "/video/unidentified-anomalous-phenomena-exposing-the-truth-2024"
  status = 301
[[redirects]]
  from = "/video/unidentified-anomalous-phenomena-exposing-the-truth-full"
  to = "/video/unidentified-anomalous-phenomena-exposing-the-truth-2024"
  status = 301
