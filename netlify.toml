# Netlify: build the static site from content/ + media/ and publish site/.
[build]
  command = "npm run build"
  publish = "site"

[build.environment]
  NODE_VERSION = "22"
  # Puppeteer is only used by local import tools; never download a browser on Netlify.
  PUPPETEER_SKIP_DOWNLOAD = "true"
  # Public Cloudflare R2 bucket holding library PDFs/images (see README → Heavy files).
  # Switch to a custom domain later by changing this one value.
  FILES_BASE = "https://pub-86f038fb92684457b9683cd2fd44620e.r2.dev"

# The app's code and data are requested with a content hash (?v=…, scripts/pages.mjs), so a deploy changes their
# URLs: data can be kept for a year. Pages themselves are never cached (the geo edge function marks them no-store).
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
# app.js and app.css are versioned too, but images and covers keep their names when replaced, so an hour for all
# (a rule per file would combine with this one, as Netlify merges matching rules)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
# open tabs ask for this to learn of a new deploy
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"

# removed duplicates: old links point to the version we kept
[[redirects]]
  from = "/video/two-airmen-finally-tell-the-story-of-their-terrifying-ufo"
  to = "/video/air-force-veterans-abducted-by-aliens-reunite-50-years-later"
  status = 301
[[redirects]]
  from = "/video/2007-11-12-general-parviz-jafari-ufo-testimony"
  to = "/video/national-press-club-november-12th-2007-ufo-close-encounters?t=1456"
  status = 301
[[redirects]]
  from = "/video/dr-eric-davis-space-time-species-types-uap-hearing-may-1-2025"
  to = "/video/understanding-uap-science-national-security-innovation-house?t=4846"
  status = 301
